<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Heitor Bailke | Desenvolvedor Back-end &amp; Front-end Júnior</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Heitor Bailke, Desenvolvedor Back-end e Front-end Júnior. Java, Spring Boot, Angular, React, APIs REST e PostgreSQL. Conheça meus projetos e minha trajetória."
    />
    <meta name="theme-color" content="#f3f0e9" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('portfolio-theme'); } catch {}
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#191816' : '#f3f0e9';
      })();
    </script>
    <meta
      property="og:title"
      content="Heitor Bailke | Desenvolvedor Back-end &amp; Front-end Júnior"
    />
    <meta
      property="og:description"
      content="Interfaces modernas, APIs e integração de sistemas. Aberto a oportunidades como Desenvolvedor Back-end ou Front-end Júnior."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
